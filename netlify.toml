[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Handle SPA fallback for client-side routing while letting functions pass through
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
